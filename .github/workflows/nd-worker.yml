name: ND Worker
on:
  workflow_dispatch:
    inputs:
      documento_id:
        description: 'ID o nombre del PDF; vacío = continuar pendientes'
        required: false
        default: ''
      max_pages:
        description: 'Páginas máximas en esta ejecución'
        required: false
        default: '1'
      max_minutes:
        description: 'Minutos máximos en esta ejecución'
        required: false
        default: '50'
  schedule:
    - cron: '23 03 * * *'
concurrency:
  group: nd-worker
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      CARPETA_MADRE_DRIVE_ID: ${{ secrets.CARPETA_MADRE_DRIVE_ID }}
      ND_SHEETS_FOLDER_ID: ${{ secrets.ND_SHEETS_FOLDER_ID }}
      ND_SHEETS_BOOTSTRAP_URL: ${{ secrets.ND_SHEETS_BOOTSTRAP_URL }}
      ND_SHEETS_BOOTSTRAP_TOKEN: ${{ secrets.ND_SHEETS_BOOTSTRAP_TOKEN }}
      ND_DOCUMENTO_ID: ${{ inputs.documento_id }}
      ND_MAX_PAGES_PER_RUN: ${{ inputs.max_pages || '1' }}
      ND_MAX_MINUTES_PER_RUN: ${{ inputs.max_minutes || '50' }}
      ND_PYTHON_TIMEOUT_MS: 600000
      ND_ALLOW_DB_WRITES: 'false'
      ND_WRITE_DESTINATION: ''
      ND_PAGES_PER_CHUNK: 10
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar OCR local
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-spa
      - name: Instalar dependencias Node
        run: npm install --no-audit --no-fund
      - name: Instalar dependencias Python
        run: python -m pip install --upgrade pip && python -m pip install -r worker/requirements.txt
      - name: Validar configuración
        run: |
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON"
          test -n "$CARPETA_MADRE_DRIVE_ID"
          test -n "$ND_SHEETS_FOLDER_ID"
          test -n "$ND_SHEETS_BOOTSTRAP_URL"
          test -n "$ND_SHEETS_BOOTSTRAP_TOKEN"
          python -c "import fitz; print('PYMUPDF_OK')"
          python -c "import camelot; print('CAMELOT_OK')"
          tesseract --version | head -1
          echo ND_CONFIG_OK_NO_AI
      - name: Ejecutar extracción ND
        run: npm run worker:nd
