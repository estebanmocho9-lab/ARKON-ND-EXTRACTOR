name: ND Engine Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar OCR local
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-spa
      - name: Instalar dependencias
        run: python -m pip install --upgrade pip && python -m pip install -r worker/requirements.txt
      - name: Selftest
        run: python worker/test_deterministic.py
