name: CI
on:
  push:
    branches: [main, nd-sheets-fusion]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r worker/requirements.txt
      - run: python -m py_compile worker/deterministic_extractor.py
      - run: python worker/test_deterministic.py
